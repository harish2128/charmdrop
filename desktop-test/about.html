<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About CharmDrop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 12px;
      color: #F8FAFC;
    }

    .about-card {
      width: 100%;
      max-width: 320px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 13px;
      position: relative;
      animation: modalSlideIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, #FFFFFF 0%, #93C5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 600;
      color: #93C5FD;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 1.5px 6px;
      border-radius: 9999px;
      letter-spacing: 0.2px;
    }

    .tagline {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.35;
    }

    .os-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: #64748B;
      font-weight: 500;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94A3B8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .section-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .section-title {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #60A5FA;
    }

    .control-item {
      font-size: 11px;
      color: #CBD5E1;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-bullet {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #3B82F6;
      flex-shrink: 0;
    }

    .shortcuts-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .shortcut-desc {
      color: #CBD5E1;
      font-weight: 500;
    }

    .shortcut-keys {
      display: flex;
      align-items: center;
      gap: 2.5px;
    }

    kbd {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      padding: 1.5px 5px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 2px;
    }

    .btn-done {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      border: 1px solid #60A5FA;
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
      transition: all 0.15s ease;
    }

    .btn-done:hover {
      background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>
  <div class="about-card">
    <div class="header-row">
      <div class="brand-wrap">
        <div class="brand-title-wrap">
          <span class="brand-title">CharmDrop</span>
          <span id="versionText" class="version-badge">v1.0.0</span>
        </div>
        <div class="tagline">"A little charm for your screen."</div>
        <div class="os-badge">Windows 10 &amp; Windows 11</div>
      </div>
      <button id="closeBtn" class="close-btn" title="Close (Esc)">✕</button>
    </div>

    <div class="section-box">
      <div class="section-title">Controls</div>
      <div class="control-item">
        <span class="control-bullet"></span>
        <span>Drag the charm to move it.</span>
      </div>
      <div class="control-item">
        <span class="control-bullet"></span>
        <span>Move your cursor near it to interact.</span>
      </div>
    </div>

    <div class="section-box">
      <div class="section-title">Keyboard Shortcuts</div>
      <div class="shortcuts-grid">
        <div class="shortcut-row">
          <span class="shortcut-desc">Show / Hide</span>
          <div class="shortcut-keys"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Charm Selector</span>
          <div class="shortcut-keys"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Reset Position</span>
          <div class="shortcut-keys"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Quit</span>
          <div class="shortcut-keys"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Q</kbd></div>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <button id="doneBtn" class="btn-done">Close</button>
    </div>
  </div>

  <script>
    const closeWindow = () => {
      if (window.electronAPI && window.electronAPI.closeAboutWindow) {
        window.electronAPI.closeAboutWindow();
      } else {
        window.close();
      }
    };

    document.getElementById('closeBtn').addEventListener('click', closeWindow);
    document.getElementById('doneBtn').addEventListener('click', closeWindow);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeWindow();
      }
    });

    if (window.electronAPI && window.electronAPI.getAppVersion) {
      window.electronAPI.getAppVersion().then((version) => {
        if (version) {
          document.getElementById('versionText').textContent = `v${version}`;
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
