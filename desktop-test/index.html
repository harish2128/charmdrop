<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CharmDrop Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="charm-stage">
    <!-- Flexible Rope Physics Canvas -->
    <canvas id="ropeCanvas" class="rope-canvas" width="340" height="440"></canvas>

    <!-- Hanging Pendulum Rig Anchored at Fixed Screen Top -->
    <div id="charmRig" class="charm-rig">
      <!-- Dynamic Container populated by CharmRenderer -->
      <div id="charmContainer" class="charm-container"></div>
    </div>

    <!-- Floating Helper Hint -->
    <div id="hintPill" class="charm-hint-pill">
      <span>Scroll • Drag • <kbd>Ctrl+Shift+C</kbd> Choose Charm</span>
    </div>

    <!-- Development-Only Physics & Audio Debug Overlay (Toggled via Ctrl+Shift+D) -->
    <div id="physicsDebugOverlay" class="physics-debug-overlay" style="display: none;"></div>
  </div>

  <script type="module" src="js/charmRenderer.js"></script>
</body>
</html>
